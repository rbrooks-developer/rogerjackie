<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 – Page Not Found</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #0a0a0f;
        color: #f8fafc;
        font-family: 'Inter', system-ui, sans-serif;
        text-align: center;
        padding: 2rem;
      }
      h1 { font-size: clamp(5rem, 15vw, 9rem); font-weight: 800; color: #6366f1; line-height: 1; margin-bottom: 1rem; }
      p { font-size: clamp(1rem, 2.5vw, 1.4rem); color: #94a3b8; max-width: 420px; }
    </style>
  </head>
  <body>
    <h1>404</h1>
    <p>This page is no longer available.</p>
  </body>
</html>
